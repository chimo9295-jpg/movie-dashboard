<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026五一档电影数据看板</title>
    <script src="https://cdn.bootcdn.net/ajax/libs/echarts/5.5.0/echarts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            min-height: 100vh;
            background: #1a1530 url('bg.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #fff; overflow-x: hidden;
        }
        .header { text-align: center; padding: 24px 20px 10px; z-index: 10; }
        .header h1 { font-size: 28px; font-weight: 700; letter-spacing: 4px; text-shadow: 0 2px 12px rgba(0,0,0,0.5); }
        .header .subtitle { font-size: 13px; opacity: 0.65; letter-spacing: 2px; margin-top: 2px; }

        .dashboard { max-width: 1240px; margin: 0 auto; padding: 8px 24px 24px;
            display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 14px; justify-items: center; }

        .card { background: rgba(10,8,24,0.65); border: 1px solid rgba(232,196,160,0.45);
            border-radius: 14px; padding: 16px; width: 100%;
            transition: all 0.3s; min-height: 140px; }
        .card:hover { border-color: rgba(240,212,176,0.7); box-shadow: 0 0 24px rgba(232,196,160,0.12); }
        .card-title { font-size: 13px; font-weight: 600; margin-bottom: 12px;
            display: flex; align-items: center; gap: 8px; opacity: 0.85; }
        .card-title .icon { width: 26px; height: 26px; border-radius: 7px;
            display: flex; align-items: center; justify-content: center; font-size: 13px; flex-shrink: 0; }

        .stat-card { grid-column: span 1; }
        .big-num { font-size: 38px; font-weight: 800; line-height: 1; }
        .gradient-text { background: linear-gradient(135deg, #FFD700, #FF6B6B);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .gradient-cyan { background: linear-gradient(135deg, #64DCB4, #4facfe);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .meta-row { display: flex; gap: 12px; margin-top: 10px; padding-top: 8px;
            border-top: 1px solid rgba(255,255,255,0.1); flex-wrap: wrap; }
        .meta-item { text-align: center; }
        .meta-item .val { font-size: 15px; font-weight: 700; }
        .meta-item .lbl { font-size: 10px; opacity: 0.55; margin-top: 2px; }

        .chart-panel { grid-column: span 2; min-height: 340px; }
        .chart-panel.span3 { grid-column: span 3; }
        .chart-panel.full { grid-column: span 4; }
        .chart-box { width: 100%; height: calc(100% - 38px); min-height: 280px; }
        .chart-panel.full .chart-box { min-height: 360px; }

        .chatbi-panel { grid-column: span 1; min-height: 340px; display: flex; flex-direction: column; }
        .chatbi-messages { flex: 1; overflow-y: auto; padding: 4px 0;
            display: flex; flex-direction: column; gap: 8px; max-height: 380px; min-height: 160px; font-size: 12px; }
        .chatbi-messages .msg { max-width: 95%; }
        .chatbi-messages .msg.user { align-self: flex-end; }
        .chatbi-messages .msg.user .bubble { background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff; border-radius: 12px 12px 2px 12px; padding: 8px 12px; }
        .chatbi-messages .msg.assistant { align-self: flex-start; }
        .chatbi-messages .msg.assistant .bubble { background: rgba(255,255,255,0.1);
            border-radius: 12px 12px 12px 2px; padding: 8px 12px; font-size: 11px; line-height: 1.5; }
        .chatbi-input { display: flex; gap: 6px; margin-top: 8px; }
        .chatbi-input input { flex: 1; padding: 8px 12px; border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.08);
            color: #fff; font-size: 12px; outline: none; }
        .chatbi-input input:focus { border-color: #667eea; }
        .chatbi-input button { padding: 8px 14px; border-radius: 16px; border: none;
            background: linear-gradient(135deg, #667eea, #764ba2); color: #fff;
            cursor: pointer; font-size: 12px; white-space: nowrap; }

        .summary-table { width: 100%; font-size: 11px; border-collapse: collapse; }
        .summary-table th { text-align: left; padding: 6px 8px; border-bottom: 1px solid rgba(255,255,255,0.15); opacity: 0.6; font-size:10px; }
        .summary-table td { padding: 6px 8px; border-bottom: 1px solid rgba(255,255,255,0.07); }
        .summary-table .bar-cell { position: relative; }
        .summary-table .bar-inner { height: 6px; border-radius: 3px; display: inline-block; vertical-align: middle; margin-right: 6px; }

        .update-time { text-align: center; padding: 6px; font-size: 11px; opacity: 0.4; }

        .loading-inline { display: flex; align-items: center; justify-content: center; height: 80px; opacity: 0.4; }
        .loading-inline::after { content: ''; width: 22px; height: 22px;
            border: 2px solid rgba(255,255,255,0.15); border-top-color: rgba(255,255,255,0.6);
            border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .result-table { width: 100%; font-size: 10px; border-collapse: collapse; margin-top: 4px; }
        .result-table th { text-align: left; padding: 2px 6px; opacity: 0.5; }
        .result-table td { padding: 2px 6px; }

        /* ChatBI markdown content */
        .chatbi-messages .bubble table { width: 100%; font-size: 10px; border-collapse: collapse; margin: 6px 0; }
        .chatbi-messages .bubble table th { text-align: left; padding: 3px 6px; border-bottom: 1px solid rgba(255,255,255,0.2); opacity: 0.7; font-size: 10px; }
        .chatbi-messages .bubble table td { padding: 3px 6px; border-bottom: 1px solid rgba(255,255,255,0.06); font-size: 10px; }
        .chatbi-messages .bubble code { background: rgba(255,255,255,0.1); padding: 1px 4px; border-radius: 3px; font-size: 10px; }
        .chatbi-messages .bubble pre { background: rgba(0,0,0,0.3); padding: 8px; border-radius: 6px; overflow-x: auto; font-size: 10px; margin: 6px 0; }
        .chatbi-messages .bubble ul, .chatbi-messages .bubble ol { padding-left: 16px; margin: 4px 0; }
        .chatbi-messages .bubble li { margin: 2px 0; line-height: 1.5; }
        .chatbi-messages .bubble strong { color: #FFD700; }
        .chatbi-messages .bubble h1,.chatbi-messages .bubble h2,.chatbi-messages .bubble h3 { margin: 8px 0 4px; font-size: 13px; }
        .chatbi-messages .bubble p { margin: 4px 0; }
        .chatbi-messages .bubble hr { border: none; border-top: 1px solid rgba(255,255,255,0.1); margin: 8px 0; }
        .chatbi-toolbar { display: flex; gap: 4px; margin-top: 6px; }
        .chatbi-toolbar button { padding: 4px 8px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.2); background: transparent; color: rgba(255,255,255,0.5); cursor: pointer; font-size: 10px; transition: all 0.2s; }
        .chatbi-toolbar button:hover { border-color: rgba(255,255,255,0.4); color: rgba(255,255,255,0.8); }
        /* 预测卡片 */
        .predict-today-val { font-size: 36px; font-weight: 800; line-height: 1; }
        .predict-today-unit { font-size: 13px; font-weight: 400; opacity: 0.5; margin-left: 4px; }
        .predict-row { display: flex; align-items: center; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid rgba(255,255,255,0.06); }
        .predict-row:last-child { border-bottom: none; }
        .predict-label { font-size: 11px; opacity: 0.55; }
        .predict-value { font-size: 14px; font-weight: 700; }
        .predict-trend { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 700; padding: 3px 8px; border-radius: 10px; }
        .predict-trend.up { color: #64DCB4; background: rgba(100,220,180,0.12); }
        .predict-trend.down { color: #FF6B6B; background: rgba(255,107,107,0.12); }
        .predict-trend.stable { color: #a0aec0; background: rgba(160,174,192,0.12); }
        .predict-trend .arrow { font-size: 16px; }
        .predict-lifecycle { display: inline-block; padding: 4px 10px; border-radius: 10px; font-size: 11px; font-weight: 700; }
        .predict-lifecycle.boom { color: #FF9F43; background: rgba(255,159,67,0.15); }
        .predict-lifecycle.growth { color: #64DCB4; background: rgba(100,220,180,0.12); }
        .predict-lifecycle.decline { color: #a0aec0; background: rgba(160,174,192,0.12); }
        .predict-model-note { margin-top: 10px; padding-top: 8px; border-top: 1px solid rgba(255,255,255,0.08); font-size: 10px; opacity: 0.4; line-height: 1.5; }

        /* ========== 手机自适应 (< 768px) ========== */
        @media (max-width: 767px) {
            .header { padding: 18px 16px 8px; }
            .header h1 { font-size: 20px; letter-spacing: 2px; }
            .header .subtitle { font-size: 11px; }

            .dashboard {
                grid-template-columns: 1fr 1fr;
                gap: 12px;
                padding: 8px 12px 24px;
                max-width: 100%;
            }

            .card { padding: 12px; border-radius: 12px; min-width: 0; }

            /* 前4张 stat 卡片自动形成 2×2 四宫格 */
            .stat-card { grid-column: span 1 !important; }

            /* 图表面板、ChatBI、汇总表格等强制全宽（占2列） */
            .chart-panel,
            .chart-panel.span3,
            .chart-panel.full,
            .chatbi-panel,
            #predict-card-wrap,
            .card[style*="grid-column:span 2"],
            .card[style*="grid-column: span 2"] {
                grid-column: span 2 !important;
            }

            /* 图表高度适配 */
            .chart-panel { min-height: 350px; }
            .chart-panel.full { min-height: 350px; }
            .chart-box { min-height: 300px; }
            .chart-panel.full .chart-box { min-height: 310px; }
            #chart-radar { height: 320px !important; }

            /* 字体适当缩小但保持可读 */
            .big-num { font-size: 26px; }
            .predict-today-val { font-size: 24px; }
            .card-title { font-size: 11px; }
            .card-title .icon { width: 22px; height: 22px; font-size: 11px; border-radius: 5px; }
            .meta-item .val { font-size: 12px; }
            .meta-item .lbl { font-size: 9px; }
            .meta-row { gap: 8px; }

            /* 表格字号保底 */
            .summary-table { font-size: 9px; }
            .summary-table th { font-size: 8px; padding: 4px 4px; }
            .summary-table td { font-size: 9px; padding: 4px 4px; }
            .bar-cell .bar-inner { height: 4px; }

            /* ChatBI 面板 */
            .chatbi-panel { min-height: 280px; }
            .chatbi-messages { max-height: 240px; font-size: 11px; }
            .chatbi-input input { font-size: 11px; }
            .chatbi-input button { font-size: 11px; padding: 8px 10px; }
            .chatbi-toolbar button { font-size: 9px; padding: 3px 6px; }

            /* 表格横向滚动保护 */
            #summary-table-wrap { overflow-x: auto; }
            .result-table { font-size: 9px; }
        }
    </style>
</head>
<body>

<script>
// ==================== Supabase ====================
const CHATBI_API = 'https://1435554604-i8omtech6l.ap-guangzhou.tencentscf.com';
const SB = {
    url: 'https://ebmncqnzammtplpwlveb.supabase.co/rest/v1',
    key: 'sb_publishable_36nGYLplp0DYcGbTx6GWpA_K11Jb9Gd'
};
function sbFetch(path) {
    return fetch(SB.url + path, {
        headers: { 'apikey': SB.key, 'Authorization': 'Bearer ' + SB.key }
    }).then(r => r.json());
}

// ==================== Global State ====================
let allData = null;
let charts = {};
const AMAH_ID = 1516982;
const MOVIES = [
    { id: 1516982, name: '给阿嬷的情书', color: '#FF6B6B' },
    { id: 1528954, name: '消失的人', color: '#4facfe' },
    { id: 1525209, name: '寒战1994', color: '#FFD700' },
    { id: 1528750, name: '穿普拉达的女王2', color: '#64DCB4' },
];

// ==================== Load Data ====================
async function loadAllData() {
    try {
        const [movies, dailyStats, dashboard, realtime, comments] = await Promise.all([
            sbFetch('/mayday_movies?order=movie_id.asc'),
            sbFetch('/mayday_daily_stats?order=stat_date.asc&limit=200'),
            sbFetch('/mayday_dashboard?order=movie_id.asc&limit=10'),
            sbFetch('/movie_realtime?order=crawl_time.asc&limit=100'),
            sbFetch('/douban_comments?limit=100'),
        ]);

        const dailyByMovie = {};
        (dailyStats||[]).forEach(d => {
            const mid = d.movie_id;
            if (!dailyByMovie[mid]) dailyByMovie[mid] = [];
            dailyByMovie[mid].push(d);
        });

        const dashByMovie = {};
        (dashboard||[]).forEach(d => {
            dashByMovie[d.movie_id] = d;
        });

        const latestRT = (realtime||[]).length ? realtime[realtime.length-1] : {};

        allData = {
            movies, dailyStats, dashboard, dailyByMovie, dashByMovie,
            realtime: latestRT, realtime_all: realtime||[],
            comments: comments||[],
        };
        console.log('Data loaded:', movies.length, 'movies,', dailyStats.length, 'daily records');
        renderAll();
    } catch(e) {
        console.error('Load failed:', e);
        document.getElementById('total-card').innerHTML =
            '<div style="color:#FF6B6B;padding:20px;">加载失败: ' + e.message + '</div>';
    }
}

// ==================== Render All ====================

// ==================== 票房预测卡片（给阿嬷的情书 · EWMA） ====================
function renderPredictCard() {
    const el = document.getElementById('predict-card');
    const d = allData.dailyByMovie || {};
    const records = d[AMAH_ID] || [];
    if (!records.length) {
        el.innerHTML = '<div style="font-size:11px;opacity:0.4;padding:16px 0;">暂无票房数据</div>';
        return;
    }

    const sorted = [...records].sort((a, b) => (a.stat_date || '').localeCompare(b.stat_date || ''));

    // ---- 日期分类：五一假期 / 周末 / 工作日 ----
    const HOLIDAY_END = '2026-05-05';
    function getDayType(dateStr) {
        if (!dateStr) return 'weekday';
        if (dateStr >= '2026-05-01' && dateStr <= HOLIDAY_END) return 'holiday';
        var dow = new Date(dateStr + 'T00:00:00').getDay();
        return (dow === 0 || dow === 6) ? 'weekend' : 'weekday';
    }
    var TYPE_LABEL = { holiday: '假期', weekend: '周末', weekday: '工作日' };

    // ---- 计算各类型日均票房 ----
    var byType = { holiday: [], weekend: [], weekday: [] };
    sorted.forEach(function(r) {
        var type = getDayType(r.stat_date);
        byType[type].push(r.daily_box || 0);
    });
    function avg(arr) { return arr.length ? arr.reduce(function(a, b) { return a + b; }, 0) / arr.length : 0; }
    var avgs = { holiday: avg(byType.holiday), weekend: avg(byType.weekend), weekday: avg(byType.weekday) };

    // 基准 = 工作日均值，缺失类型用合理默认值（周末≈1.3x, 假期≈2.0x）
    var baseline = avgs.weekday || avgs.weekend || avgs.holiday || 1;
    var multipliers = {
        holiday: avgs.holiday > 0 ? avgs.holiday / baseline : 2.0,
        weekend: avgs.weekend > 0 ? avgs.weekend / baseline : 1.3,
        weekday: 1.0
    };

    // ---- 去季节化：Box_adj = Box / multiplier ----
    var adjusted = sorted.map(function(r) {
        var type = getDayType(r.stat_date);
        return (r.daily_box || 0) / (multipliers[type] || 1);
    });

    // ---- EWMA on adjusted series ----
    var alpha = 0.3;
    var ewma = [adjusted[0]];
    for (var i = 1; i < adjusted.length; i++) {
        ewma.push(alpha * adjusted[i] + (1 - alpha) * ewma[i - 1]);
    }

    // ---- 最新值 ----
    var latest = sorted[sorted.length - 1];
    var latestBox = latest.daily_box || 0;
    var latestType = getDayType(latest.stat_date);
    var latestAdj = adjusted[adjusted.length - 1];
    var latestEwma = ewma[ewma.length - 1];

    // ---- 明日预测：去季节化趋势 × 明日类型系数 ----
    var tomorrowDate = getNextDate(latest.stat_date);
    var tomorrowType = getDayType(tomorrowDate);
    var tomorrowAdj = alpha * latestAdj + (1 - alpha) * latestEwma;
    var tomorrowPred = tomorrowAdj * (multipliers[tomorrowType] || 1);

    // ---- 去季节化趋势（调整后EWMA后半段 vs 前半段） ----
    var N = Math.min(6, ewma.length);
    var seg = ewma.slice(-N);
    var mid = Math.floor(N / 2);
    var firstHalf = seg.slice(0, mid).reduce(function(a, b) { return a + b; }, 0) / mid;
    var secondHalf = seg.slice(mid).reduce(function(a, b) { return a + b; }, 0) / mid;
    var adjTrend = firstHalf > 0 ? (secondHalf - firstHalf) / firstHalf : 0;

    var trend, trendClass, trendArrow;
    if (adjTrend > 0.05) {
        trend = '上升'; trendClass = 'up'; trendArrow = '▲';
    } else if (adjTrend < -0.05) {
        trend = '下降'; trendClass = 'down'; trendArrow = '▼';
    } else {
        trend = '平稳'; trendClass = 'stable'; trendArrow = '─';
    }

    // ---- 生命周期（基于去季节化真实趋势） ----
    var daysSinceRelease = sorted.length;
    var stage, stageClass;
    if (daysSinceRelease <= 5 && adjTrend > -0.05) {
        stage = '爆发期'; stageClass = 'boom';
    } else if (adjTrend > 0.03) {
        stage = '增长期'; stageClass = 'boom';
    } else if (adjTrend > -0.08) {
        stage = '稳定期'; stageClass = 'growth';
    } else {
        stage = '衰退期'; stageClass = 'decline';
    }

    // ---- 当日票房 vs 同类型均值对比 ----
    var sameTypeAvg = avgs[latestType] || latestBox;
    var vsAvg = sameTypeAvg > 0 ? ((latestBox - sameTypeAvg) / sameTypeAvg * 100) : 0;
    var vsAvgStr = vsAvg > 0 ? '高于' + TYPE_LABEL[latestType] + '均值 ' + vsAvg.toFixed(0) + '%' :
                   vsAvg < 0 ? '低于' + TYPE_LABEL[latestType] + '均值 ' + Math.abs(vsAvg).toFixed(0) + '%' :
                   '与' + TYPE_LABEL[latestType] + '均值持平';

    // ---- 周末/假期效应提示 ----
    var calendarNote = '';
    if (tomorrowType === 'weekend' && latestType === 'weekday') {
        calendarNote = '<div style="font-size:10px;color:#64DCB4;margin-top:2px;">📅 明日为周末，预测已自动上调</div>';
    } else if (tomorrowType === 'weekday' && (latestType === 'weekend' || latestType === 'holiday')) {
        calendarNote = '<div style="font-size:10px;color:#FF9F43;margin-top:2px;">📅 明日为工作日，自然回落属正常现象</div>';
    }

    // ---- 今日预测（回测最后一个预测值） ----
    var todayPred = null;

    // ---- 近N天预测回测 (MAPE) ----
    var backtestN = Math.min(7, sorted.length - 2);
    var backtestApes = [];
    if (backtestN >= 2) {
        for (var bi = sorted.length - backtestN - 1; bi < sorted.length - 1; bi++) {
            var trainSlice = sorted.slice(0, bi + 1);
            var btByType = { holiday:[], weekend:[], weekday:[] };
            trainSlice.forEach(function(rr) {
                var tt = getDayType(rr.stat_date);
                btByType[tt].push(rr.daily_box || 0);
            });
            function btAvg(arr) { return arr.length ? arr.reduce(function(a,b){return a+b;},0)/arr.length : 0; }
            var btAvgs = { holiday: btAvg(btByType.holiday), weekend: btAvg(btByType.weekend), weekday: btAvg(btByType.weekday) };
            var btBL = btAvgs.weekday || btAvgs.weekend || btAvgs.holiday || 1;
            var btMult = {
                holiday: btAvgs.holiday > 0 ? btAvgs.holiday/btBL : 2.0,
                weekend: btAvgs.weekend > 0 ? btAvgs.weekend/btBL : 1.3,
                weekday: 1.0
            };
            var btAdj = trainSlice.map(function(rr) {
                return (rr.daily_box||0) / (btMult[getDayType(rr.stat_date)] || 1);
            });
            var btEwma = [btAdj[0]];
            for (var ej = 1; ej < btAdj.length; ej++) {
                btEwma.push(alpha * btAdj[ej] + (1-alpha) * btEwma[ej-1]);
            }
            var btLastAdj = btAdj[btAdj.length-1];
            var btLastEwma = btEwma[btEwma.length-1];
            var btPredAdj = alpha * btLastAdj + (1-alpha) * btLastEwma;
            var actualDate = sorted[bi+1].stat_date;
            var btPredType = getDayType(actualDate);
            var btPred = btPredAdj * (btMult[btPredType] || 1);
            var actualVal = sorted[bi+1].daily_box || 0;
            if (actualVal > 0) {
                var ape = Math.abs(actualVal - btPred) / actualVal;
                backtestApes.push({date: actualDate, pred: btPred, actual: actualVal, ape: ape});
            }
        }
    }

    // 提取回测中对今天日期的预测值作为"今日预测票房"
    if (backtestApes.length > 0) {
        todayPred = backtestApes[backtestApes.length - 1].pred;
    }

    // 今日实时票房（从mayday_dashboard.realtime_box_num）
    var realtimeBox = (allData.dashByMovie[AMAH_ID] || {}).realtime_box_num;

    var mapeHtml = '';
    var latestDate = getLatestDate();
    var filteredApes = backtestApes.filter(function(a) { return a.date !== latestDate; });
    if (filteredApes.length >= 2) {
        var totalApe = filteredApes.reduce(function(s, a) { return s + a.ape; }, 0);
        var mapeVal = totalApe / filteredApes.length;
        var mapeColor = mapeVal < 0.1 ? '#64DCB4' : (mapeVal < 0.25 ? '#FFD700' : '#FF6B6B');
        mapeHtml = '<div style="margin-top:10px;padding-top:8px;border-top:1px solid rgba(255,255,255,0.08);">' +
            '<div style="font-size:10px;opacity:0.5;margin-bottom:6px;">平均预测误差（MAPE）</div>' +
            '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">' +
                '<span style="font-size:11px;">近' + filteredApes.length + '天回测样本</span>' +
                '<span style="font-size:16px;font-weight:700;color:' + mapeColor + ';">' + (mapeVal*100).toFixed(2) + '%</span>' +
            '</div>';
        filteredApes.forEach(function(a) {
            var barW = Math.min(100, Math.max(5, a.ape * 400));
            var barColor = a.ape < 0.1 ? '#64DCB4' : (a.ape < 0.25 ? '#FFD700' : '#FF6B6B');
            mapeHtml += '<div style="display:flex;align-items:center;gap:4px;font-size:9px;margin-bottom:2px;">' +
                '<span style="opacity:0.4;width:44px;">' + (a.date||'').slice(5) + '</span>' +
                '<span style="display:inline-block;width:' + barW + 'px;height:4px;border-radius:2px;background:' + barColor + ';"></span>' +
                '<span style="opacity:0.6;">' + (a.ape*100).toFixed(0) + '%</span>' +
                '<span style="opacity:0.3;">预测' + formatBoxOffice(a.pred) + ' vs 实际' + formatBoxOffice(a.actual) + '</span>' +
            '</div>';
        });
        mapeHtml += '</div>';
    }

    var todayPredDisplay, todayPredNote;
    if (todayPred != null) {
        todayPredDisplay = formatBoxOffice(todayPred);
        todayPredNote = '今日预测 · EWMA模型';
    } else {
        todayPredDisplay = '数据不足';
        todayPredNote = '需要更多历史数据';
    }

    el.innerHTML =
        '<div>' +
            '<span class="predict-today-val" style="background:linear-gradient(135deg,#FF9F43,#FF6B6B);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;">' + todayPredDisplay + '</span><span class="predict-today-unit"></span>' +
            '<span style="display:inline-block;padding:2px 8px;border-radius:8px;font-size:10px;margin-left:6px;background:rgba(255,255,255,0.08);">' + TYPE_LABEL[latestType] + '</span>' +
        '</div>' +
        '<div style="font-size:10px;opacity:0.45;margin-bottom:10px;">' + (latest.stat_date || '--') + ' · ' + todayPredNote + '</div>' +
        '<div class="predict-row">' +
            '<span class="predict-label">去季节化趋势</span>' +
            '<span class="predict-trend ' + trendClass + '"><span class="arrow">' + trendArrow + '</span>' + trend + ' ' + (adjTrend >= 0 ? '+' : '') + (adjTrend * 100).toFixed(1) + '%</span>' +
        '</div>' +
        '<div class="predict-row">' +
            '<span class="predict-label">明日预测 <span style="font-size:9px;opacity:0.5;">(' + TYPE_LABEL[tomorrowType] + ')</span></span>' +
            '<span class="predict-value gradient-cyan">' + formatBoxOffice(tomorrowPred) + '</span><span style="font-size:10px;opacity:0.5;"></span>' +
        '</div>' +
        calendarNote +
        (realtimeBox != null ? '<div class="predict-row">' +
            '<span class="predict-label">今日实时票房</span>' +
            '<span class="predict-value">' + formatBoxOffice(realtimeBox) + '</span>' +
        '</div>' : '') +
        '<div class="predict-row">' +
            '<span class="predict-label">生命周期</span>' +
            '<span class="predict-lifecycle ' + stageClass + '">' + stage + '</span>' +
        '</div>' +
        '<div class="predict-model-note">' +
            '季节调整 EWMA · α=0.3 · 基于' + sorted.length + '日数据<br>' +
            '假期系数 ' + multipliers.holiday.toFixed(1) + 'x · 周末系数 ' + multipliers.weekend.toFixed(1) + 'x · 工作日基准 1.0x' +
        '</div>' +
        mapeHtml;
}

function getLatestDate() {
    const ds = allData.dailyStats||[];
    if (!ds.length) return '--';
    return ds.reduce((max, d) => d.stat_date > max ? d.stat_date : max, '');

function getLatestCrawlTime() {
    const ds = allData.dailyStats||[];
    if (!ds.length) return null;
    return ds.reduce((max, d) => (d.crawl_time||'') > max ? d.crawl_time : max, '');
}

// ==================== 今日大盘 ====================
function renderTodayCard() {
    const el = document.getElementById('today-card');
    const d = allData.dailyByMovie||{};
    const dash = allData.dashByMovie||{};

    let todayDaily = 0;
    const latest = getLatestDate();
    MOVIES.forEach(m => {
        const records = d[m.id]||[];
        const today = records.find(r => r.stat_date === latest);
        if (today) todayDaily += today.daily_box||0;
    });

    // 真实大盘数据
    let marketDesc = '', marketVal = 0;
    for (const mid in dash) {
        const dd = dash[mid];
        if (dd && dd.market_total_desc) { marketDesc = dd.market_total_desc; break; }
        if (dd && dd.market_total_value) { marketVal = dd.market_total_value; break; }
    }

    const topMovie = MOVIES.reduce((best, m) => {
        const dd = dash[m.id];
        const cur = dd ? parseFloat(dd.box_rate)||0 : 0;
        const bestVal = dash[best.id] ? parseFloat(dash[best.id].box_rate)||0 : 0;
        return cur > bestVal ? m : best;
    }, MOVIES[0]);

    el.innerHTML = `
        <div style="font-size:11px;opacity:0.5;margin-bottom:2px;">猫眼大盘票房</div>
        <div style="font-size:30px;font-weight:800;background:linear-gradient(135deg,#FFD700,#FF6B6B);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;">${marketVal > 0 ? (marketVal/10000).toFixed(2) + '亿' : (marketDesc || '--')}</div>
        <div style="font-size:10px;opacity:0.35;margin-top:2px;">四部影片合计 ${formatBoxOffice(todayDaily)}</div>
        <div style="margin-top:12px;padding-top:8px;border-top:1px solid rgba(255,255,255,0.08);font-size:11px;">
            <div style="display:flex;justify-content:space-between;margin-bottom:5px;"><span style="opacity:0.5;">票房冠军</span><span style="color:#FFD700;">${topMovie.name}</span></div>
            <div style="display:flex;justify-content:space-between;margin-bottom:5px;"><span style="opacity:0.5;">票房占比</span><span>${dash[topMovie.id]?.box_rate||'--'}</span></div>
            <div style="display:flex;justify-content:space-between;"><span style="opacity:0.5;">数据日期</span><span>${latest}</span></div>
        </div>`;
}

    const seriesData = MOVIES.map(m => {
        const dd = dash[m.id]||{};
        const records = d[m.id]||[];
        const lastRec = records[records.length-1]||{};

        return {
            name: m.name,
            value: [
                lastRec.daily_box || 0,
                (lastRec.total_box || 0) / 10000,
                parseFloat(dd.avg_seat_view) || 0,
                parseFloat(dd.show_count_rate) || 0,
                parseFloat(dd.box_rate) || 0,
            ],
            lineStyle: { color: m.color, width: 2 },
            areaStyle: { color: m.color + '22' },
            itemStyle: { color: m.color },
        };
    });

    chart.setOption({
        backgroundColor: 'transparent',
        tooltip: {
            trigger: 'item',
            backgroundColor: 'rgba(0,0,0,0.75)',
            borderColor: 'rgba(255,255,255,0.1)',
            textStyle: { color: '#fff', fontSize: 11 },
        },
        legend: {
            data: MOVIES.map(m => m.name),
            bottom: isMobile() ? 10 : 0,
            textStyle: { color: 'rgba(255,255,255,0.6)', fontSize: isMobile() ? 8 : 9 },
            itemWidth: isMobile() ? 10 : 12, itemHeight: isMobile() ? 6 : 8,
        },
        radar: {
            center: [isMobile() ? '50%' : '50%', isMobile() ? '44%' : '48%'],
            radius: isMobile() ? '50%' : '60%',
            indicator: indicators,
            axisName: { color: 'rgba(255,255,255,0.5)', fontSize: 9 },
            splitLine: { lineStyle: { color: 'rgba(255,255,255,0.08)' } },
            splitArea: { areaStyle: { color: ['rgba(255,255,255,0.02)', 'rgba(255,255,255,0.04)'] } },
            axisLine: { lineStyle: { color: 'rgba(255,255,255,0.1)' } },
        },
        series: [{ type: 'radar', data: seriesData, symbol: 'circle', symbolSize: 4 }]
    });
}

// ==================== 数据汇总表 ====================
function renderSummaryTable() {
    const el = document.getElementById('summary-table-wrap');
    const dash = allData.dashByMovie||{};
    const d = allData.dailyByMovie||{};

    let h = '<table class="summary-table"><thead><tr>';
    h += '<th>电影</th><th>最新日票房(万)</th><th>综合累计(亿)</th><th>上座率</th><th>排片占比</th><th>票房占比</th><th>上映天数</th>';
    h += '</tr></thead><tbody>';

    const maxDaily = Math.max(...MOVIES.map(m => {
        const records = d[m.id]||[];
        const last = records[records.length-1];
        return last ? last.daily_box : 0;
    }));

    MOVIES.forEach(m => {
        const dd = dash[m.id]||{};
        const records = d[m.id]||[];
        const lastRec = records[records.length-1]||{};
        const days = records.length;
        const dailyBar = maxDaily > 0 ? ((lastRec.daily_box||0) / maxDaily * 100) : 0;

        h += '<tr>';
        h += `<td style="font-weight:700;color:${m.color}">${m.name}</td>`;
        h += `<td class="bar-cell"><span class="bar-inner" style="width:${dailyBar*0.8}px;background:${m.color};"></span>${formatBoxOffice(lastRec.daily_box)}</td>`;
        h += `<td>${((lastRec.total_box||0)/10000).toFixed(2)}</td>`;
        h += `<td>${dd.avg_seat_view||'--'}</td>`;
        h += `<td>${dd.show_count_rate||'--'}</td>`;
        h += `<td>${dd.box_rate||'--'}</td>`;
        h += `<td>${days}天</td>`;
        h += '</tr>';
    });
    h += '</tbody></table>';
    el.innerHTML = h;
}

// ==================== ChatBI (DeepSeek via BFF proxy) ====================
const SYSTEM_PROMPT = '你是一个专业的 BI（商业智能）数据分析助手。请用分点、表格、结构化方式回答问题。若信息不足请明确说明，不要编造数据。';

let chatHistory = [];

function buildDataContext() {
    if (!allData) return '';
    const d = allData.dailyByMovie || {};
    const dash = allData.dashByMovie || {};
    const rt = allData.realtime || {};

    let ctx = '以下是当前电影数据看板的最新数据，请基于这些数据回答用户问题：\n\n';

    ctx += `豆瓣评分: ${rt.douban_score || '--'} (${rt.douban_votes ? (rt.douban_votes/10000).toFixed(1)+'万' : '--'}人评分)\n`;
    ctx += `评分分布 - 五星:${rt.star_5_pct||'--'}, 四星:${rt.star_4_pct||'--'}, 三星:${rt.star_3_pct||'--'}, 二星:${rt.star_2_pct||'--'}, 一星:${rt.star_1_pct||'--'}\n\n`;

    ctx += '各电影汇总数据:\n';
    ctx += '| 电影 | 累计票房(亿) | 最新日票房(万) | 上座率 | 排片占比 | 票房占比 | 上映天数 |\n';
    ctx += '|------|-------------|---------------|--------|---------|---------|--------|\n';
    MOVIES.forEach(m => {
        const records = d[m.id] || [];
        const last = records[records.length - 1] || {};
        const dd = dash[m.id] || {};
        ctx += `| ${m.name} | ${((last.total_box||0)/10000).toFixed(2)} | ${formatBoxOffice(last.daily_box)} | ${dd.avg_seat_view||'--'} | ${dd.show_count_rate||'--'} | ${dd.box_rate||'--'} | ${records.length}天 |\n`;
    });

    const dates = [...new Set(MOVIES.flatMap(m => (d[m.id]||[]).map(r => r.stat_date)))].sort();
    const recentDates = dates.slice(-7);
    if (recentDates.length > 0) {
        ctx += '\n最近7天日票房(万元):\n';
        ctx += '| 日期 | ' + MOVIES.map(m => m.name).join(' | ') + ' |\n';
        ctx += '|------|' + MOVIES.map(() => '---|').join('') + '\n';
        recentDates.forEach(date => {
            ctx += `| ${date} | `;
            ctx += MOVIES.map(m => {
                const rec = (d[m.id]||[]).find(r => r.stat_date === date);
                return rec ? rec.daily_box.toFixed(0) : '-';
            }).join(' | ');
            ctx += ' |\n';
        });
    }
    return ctx;
}

async function chatbiSend() {
    const input = document.getElementById('chatbiInput');
    const q = input.value.trim();
    if (!q) return;

    input.value = '';
    const msgs = document.getElementById('chatbiMsgs');

    msgs.innerHTML += `<div class="msg user"><div class="bubble">${esc(q)}</div></div>`;
    msgs.innerHTML += '<div class="msg assistant"><div class="bubble"><div class="loading-inline"></div></div></div>';
    msgs.scrollTop = msgs.scrollHeight;

    try {
        const messages = [
            { role: 'system', content: SYSTEM_PROMPT },
        ];

        const dataCtx = buildDataContext();
        if (dataCtx) {
            messages.push({ role: 'system', content: dataCtx });
        }

        messages.push(...chatHistory.slice(-30));
        messages.push({ role: 'user', content: q });

        const response = await fetch(CHATBI_API, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ messages: messages }),
        });

        if (!response.ok) {
            const err = await response.json().catch(() => ({}));
            const msg = typeof err.error === 'string' ? err.error : err.error?.message;
            throw new Error(msg || 'API 请求失败 (' + response.status + ')');
        }

        const result = await response.json();
        const reply = result?.choices?.[0]?.message?.content || 'AI 返回了空响应，请重试';

        chatHistory.push({ role: 'user', content: q });
        chatHistory.push({ role: 'assistant', content: reply });

        msgs.lastChild.remove();
        msgs.innerHTML += `<div class="msg assistant"><div class="bubble">${marked.parse(reply)}</div></div>`;
        msgs.scrollTop = msgs.scrollHeight;
    } catch (e) {
        msgs.lastChild.remove();
        msgs.innerHTML += `<div class="msg assistant"><div class="bubble" style="color:#FF6B6B;">${esc('错误: ' + e.message)}</div></div>`;
        msgs.scrollTop = msgs.scrollHeight;
    }
}

function clearChatHistory() {
    chatHistory = [];
    const msgs = document.getElementById('chatbiMsgs');
    msgs.innerHTML = '<div class="msg assistant"><div class="bubble">你好！我是五一档数据分析助手。<br>试试问：排名、上座率对比、日票房趋势、评分...</div></div>';
}

// ==================== Utils ====================
function fmtNum(n) {
    if (n==null||isNaN(n)) return '--';
    if (Math.abs(n)>=10000) return (n/10000).toFixed(2);
    return Number(n).toLocaleString('zh-CN',{maximumFractionDigits:1});
}
function formatBoxOffice(value) {
    if (value == null || isNaN(value)) return '--';
    if (Math.abs(value) >= 10000) return (value / 10000).toFixed(2) + '亿';
    return Number(value).toFixed(0) + '万';
}
function getNextDate(dateStr) {
    var d = new Date(dateStr + 'T00:00:00');
    d.setDate(d.getDate() + 1);
    return d.toISOString().slice(0, 10);
}
function esc(s) {
    const d=document.createElement('div'); d.textContent=s; return d.innerHTML;
}

// ==================== Init ====================
document.addEventListener('DOMContentLoaded', () => {
    loadAllData();
    setInterval(loadAllData, 300000);
});
window.addEventListener('resize', () => {
    const wasMobile = window._wasMobile;
    const nowMobile = isMobile();
    window._wasMobile = nowMobile;
    if (wasMobile !== nowMobile) {
        renderAll();
    } else {
        Object.values(charts).forEach(c => { try { c.resize(); } catch(e){} });
    }
});
